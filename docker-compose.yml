services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pst-agent:
    build: .
    image: pst-agent:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PST_AGENT_POSTGRES_DSN: postgresql://rag:rag@postgres:5432/rag
      PST_AGENT_PORT: "8000"
      PST_AGENT_DATA_DIR: /app/state
      RAG_TENANT_ID: default
      RAG_TRUST_CONTEXT_HEADERS: "true"
    volumes:
      - ./example-data:/data/inbox:ro
      - pst-agent-state:/app/state
    command: ["api"]

volumes:
  postgres-data:
  pst-agent-state:
