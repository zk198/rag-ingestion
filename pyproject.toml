[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pst-agent"
version = "0.1.0"
description = "Containerized PST and document ingestion backend for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "Pillow>=10.4,<12.0",
  "pytesseract>=0.3.10,<1.0",
  "extract-msg>=0.52,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "fastmcp>=2.10,<4.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]\ntest = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0"]\n\n[tool.pytest.ini_options]\ntestpaths = ["tests"]\naddopts = "-ra"\n\n[project.scripts]
pst-agent = "pst_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
